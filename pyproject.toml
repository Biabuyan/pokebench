[project]
name = "pokebench"
version = "0.1.0"
description = "A fixed agent harness for Pokémon Red where the model is the only variable — standardized cross-model agent benchmark."
authors = [{ name = "Cheang Jia Yuan" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pyboy>=2.4,<3",
    "pillow>=10",
    "numpy>=1.26",
    "pyyaml>=6",
    "anthropic>=0.117.0",
]

[project.scripts]
pokebench = "pokebench.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pokebench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
