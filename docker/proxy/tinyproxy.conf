Port 8888
Listen 0.0.0.0
Timeout 600
LogLevel Info
MaxClients 20

# The proxy is only reachable on the internal `sandbox` docker network (it is
# not published to the host), and the sandboxed agent is its only client — so
# allowing the whole private range here does not widen exposure.
Allow 0.0.0.0/0

# Only HTTPS tunnels to port 443 are permitted...
ConnectPort 443

# ...and only to the hosts allowlisted in the filter file. Everything else is
# denied by default. This is the egress allowlist.
Filter "/etc/tinyproxy/filter"
FilterDefaultDeny Yes
FilterExtended On
FilterURLs Off
