name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install (frozen lockfile — supply-chain control, see SECURITY.md)
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Tests (no ROM required)
        run: uv run pytest -q
